name: validate-feynman-real-run-readiness

on:
  push:
    paths:
      - 'tooling/feynman_real_run_preflight.py'
      - 'tooling/feynman_real_smoke_plan.py'
      - 'tooling/feynman_real_model_control_config.py'
      - 'tooling/feynman_remote_exec_environment.py'
      - 'tooling/feynman_runner_job*.py'
      - 'tooling/feynman_condition_workspace.py'
      - 'tooling/feynman_eval_plan.py'
      - 'tooling/feynman_boundary_profile.py'
      - 'evals/feynman-thinking/real-model-smoke-spec.json'
      - 'evals/feynman-thinking/real-run-readiness.schema.json'
      - 'evals/feynman-thinking/conditions.json'
      - 'evals/feynman-thinking/cases.jsonl'
      - 'skills/feynman-thinking/**'
      - 'tests/test_feynman_real_run_preflight.py'
      - 'tests/test_feynman_real_smoke_plan.py'
      - '.github/workflows/validate-feynman-real-run-readiness.yml'
  pull_request:
    paths:
      - 'tooling/feynman_real_run_preflight.py'
      - 'tooling/feynman_real_smoke_plan.py'
      - 'tooling/feynman_real_model_control_config.py'
      - 'tooling/feynman_remote_exec_environment.py'
      - 'tooling/feynman_runner_job*.py'
      - 'tooling/feynman_condition_workspace.py'
      - 'tooling/feynman_eval_plan.py'
      - 'tooling/feynman_boundary_profile.py'
      - 'evals/feynman-thinking/real-model-smoke-spec.json'
      - 'evals/feynman-thinking/real-run-readiness.schema.json'
      - 'evals/feynman-thinking/conditions.json'
      - 'evals/feynman-thinking/cases.jsonl'
      - 'skills/feynman-thinking/**'
      - 'tests/test_feynman_real_run_preflight.py'
      - 'tests/test_feynman_real_smoke_plan.py'
      - '.github/workflows/validate-feynman-real-run-readiness.yml'

permissions:
  contents: read

jobs:
  pre-auth-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run readiness contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_feynman_real_run_preflight \
            tests.test_feynman_real_smoke_plan \
            tests.test_feynman_analysis_result_schema -v

      - name: Build matching control-plane and tool Codex runtimes
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/feynman-real-run-readiness
          rm -rf "$ROOT"
          mkdir -p "$ROOT/control-node" "$ROOT/build"

          CODEX_PACKAGE_VERSION="$(npm view @openai/codex version)"
          test -n "$CODEX_PACKAGE_VERSION"
          printf '%s\n' "$CODEX_PACKAGE_VERSION" > "$ROOT/codex-package-version.txt"

          npm install --silent --prefix "$ROOT/control-node" "@openai/codex@${CODEX_PACKAGE_VERSION}"
          CODEX_BIN="$ROOT/control-node/node_modules/.bin/codex"
          test -x "$CODEX_BIN"
          "$CODEX_BIN" --version | tee "$ROOT/control-codex-version.txt"
          "$CODEX_BIN" debug models --bundled > "$ROOT/bundled-models.json"

          python - "$ROOT/bundled-models.json" "$ROOT/selected-model.txt" <<'PY'
          import json
          import sys

          src, out = sys.argv[1:]
          data = json.load(open(src, encoding='utf-8'))
          models = data.get('models')
          if not isinstance(models, list):
              raise SystemExit('bundled model catalog has no models list')
          eligible = []
          for model in models:
              if not isinstance(model, dict):
                  continue
              slug = model.get('slug')
              if not isinstance(slug, str) or not slug or slug.startswith('mock-'):
                  continue
              if model.get('supported_in_api') is not True:
                  continue
              modalities = model.get('input_modalities')
              if not isinstance(modalities, list) or 'text' not in modalities:
                  continue
              eligible.append(slug)
          if not eligible:
              raise SystemExit('no bundled API-supported text model available for readiness metadata')
          with open(out, 'w', encoding='utf-8') as handle:
              handle.write(eligible[0] + '\n')
          print(eligible[0])
          PY

          cat > "$ROOT/build/Dockerfile" <<'EOF'
          FROM node:22-bookworm-slim
          ARG CODEX_PACKAGE_VERSION
          RUN npm install -g "@openai/codex@${CODEX_PACKAGE_VERSION}"
          EOF
          docker build \
            --build-arg "CODEX_PACKAGE_VERSION=$CODEX_PACKAGE_VERSION" \
            -t feynman-real-readiness:local \
            -f "$ROOT/build/Dockerfile" \
            "$ROOT/build"
          docker run --rm --network none feynman-real-readiness:local codex --version \
            | tee "$ROOT/tool-codex-version.txt"
          diff -u "$ROOT/control-codex-version.txt" "$ROOT/tool-codex-version.txt"

      - name: Freeze integration-only smoke plan
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/feynman-real-run-readiness
          python tooling/feynman_real_smoke_plan.py \
            --root . \
            --output "$ROOT/smoke-plan.json" \
            > "$ROOT/smoke-plan.stdout.json"
          python - "$ROOT/smoke-plan.json" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1], encoding='utf-8'))
          assert plan['analysis_use'] == 'not-for-skill-performance-inference'
          assert len(plan['jobs']) == 2
          assert {job['condition'] for job in plan['jobs']} == {'baseline', 'feynman-v05'}
          assert {job['case_id'] for job in plan['jobs']} == {'tools-10'}
          PY

      - name: Build both jobs to the credential boundary
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/feynman-real-run-readiness
          MODEL_ID="$(cat "$ROOT/selected-model.txt")"
          CODEX_VERSION="$(tr -d '\r\n' < "$ROOT/control-codex-version.txt")"
          DOCKER_VERSION="$(docker version --format '{{.Server.Version}}')"
          IMAGE_ID="$(docker image inspect feynman-real-readiness:local --format '{{.Id}}')"
          RUN_AS="$(id -u):$(id -g)"
          test -n "$MODEL_ID"
          test -n "$IMAGE_ID"

          for ORDINAL in 1 2; do
            JOB_ROOT="$ROOT/job-$ORDINAL"
            CANDIDATE="$JOB_ROOT/candidate"
            EVALUATOR="$JOB_ROOT/evaluator"
            CANDIDATE_HOME="$JOB_ROOT/candidate-home"
            TOOL_CODEX_HOME="$JOB_ROOT/tool-codex-home"
            TOOL_TEMP="$JOB_ROOT/tool-temp"
            mkdir -p "$CANDIDATE_HOME" "$TOOL_CODEX_HOME" "$TOOL_TEMP"

            read -r CASE_ID CONDITION_ID < <(python - "$ROOT/smoke-plan.json" "$ORDINAL" <<'PY'
          import json, sys
          plan = json.load(open(sys.argv[1], encoding='utf-8'))
          ordinal = int(sys.argv[2])
          matches = [job for job in plan['jobs'] if job['ordinal'] == ordinal]
          if len(matches) != 1:
              raise SystemExit('missing smoke ordinal')
          print(matches[0]['case_id'], matches[0]['condition'])
          PY
            )

            python tooling/feynman_condition_workspace.py \
              --root . \
              --case "$CASE_ID" \
              --condition "$CONDITION_ID" \
              --candidate-dir "$CANDIDATE" \
              --evaluator-dir "$EVALUATOR" \
              > "$JOB_ROOT/condition-workspace.json"

            python - "$JOB_ROOT/boundary-profile.json" "$DOCKER_VERSION" "$IMAGE_ID" "$RUN_AS" \
              "$CANDIDATE" "$CANDIDATE_HOME" "$TOOL_CODEX_HOME" "$TOOL_TEMP" <<'PY'
          import json
          import sys
          output, docker_version, image_id, run_as, candidate, home, codex_home, temp_dir = sys.argv[1:]
          profile = {
              'schema_version': 1,
              'backend': 'docker',
              'backend_version': docker_version,
              'image': 'feynman-real-readiness:local',
              'image_id': image_id,
              'network_mode': 'none',
              'read_only_root': True,
              'no_new_privileges': True,
              'capabilities': [],
              'run_as': run_as,
              'read_write_mounts': [candidate, home, codex_home, temp_dir],
              'read_only_mounts': [],
              'tmpfs_mounts': ['/tmp'],
              'protected_roots_mounted': [],
              'candidate_env_keys': ['HOME', 'CODEX_HOME', 'PATH', 'TMPDIR', 'PYTHONDONTWRITEBYTECODE'],
              'scope': 'credential-free real-model readiness profile; no model request',
          }
          with open(output, 'w', encoding='utf-8') as handle:
              json.dump(profile, handle, indent=2, sort_keys=True)
              handle.write('\n')
          PY
            python tooling/feynman_boundary_profile.py \
              --profile "$JOB_ROOT/boundary-profile.json" \
              > "$JOB_ROOT/boundary-profile-check.json"

            python tooling/feynman_runner_job.py \
              --plan "$ROOT/smoke-plan.json" \
              --ordinal "$ORDINAL" \
              --evaluator-case "$EVALUATOR/case.json" \
              --boundary-profile "$JOB_ROOT/boundary-profile.json" \
              --run-id "real-smoke-readiness-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ORDINAL}" \
              --model "$MODEL_ID" \
              --codex-cli "$CODEX_VERSION" \
              --candidate-dir "$CANDIDATE" \
              --evaluator-dir "$EVALUATOR" \
              --source-repo "$GITHUB_WORKSPACE" \
              --ephemeral-home "$CANDIDATE_HOME" \
              --codex-home "$TOOL_CODEX_HOME" \
              --temp-dir "$TOOL_TEMP" \
              --real-home "$HOME" \
              --control-plane-credential-env-key OPENAI_API_KEY \
              --output "$JOB_ROOT/runner-job.json" \
              > "$JOB_ROOT/runner-job.stdout.json"
            python tooling/feynman_runner_job_validate.py \
              --job "$JOB_ROOT/runner-job.json" \
              --boundary-profile "$JOB_ROOT/boundary-profile.json" \
              > "$JOB_ROOT/runner-job-check.json"

            python tooling/feynman_remote_exec_environment.py \
              --job "$JOB_ROOT/runner-job.json" \
              --boundary-profile "$JOB_ROOT/boundary-profile.json" \
              --output "$JOB_ROOT/environments.toml" \
              > "$JOB_ROOT/remote-environment-build.json"
            python tooling/feynman_remote_exec_environment.py \
              --job "$JOB_ROOT/runner-job.json" \
              --boundary-profile "$JOB_ROOT/boundary-profile.json" \
              --validate "$JOB_ROOT/environments.toml" \
              > "$JOB_ROOT/remote-environment-check.json"

            python tooling/feynman_real_model_control_config.py \
              --job "$JOB_ROOT/runner-job.json" \
              --boundary-profile "$JOB_ROOT/boundary-profile.json" \
              --output "$JOB_ROOT/control-config.toml" \
              > "$JOB_ROOT/control-config-build.json"
            python tooling/feynman_real_model_control_config.py \
              --job "$JOB_ROOT/runner-job.json" \
              --boundary-profile "$JOB_ROOT/boundary-profile.json" \
              --validate "$JOB_ROOT/control-config.toml" \
              > "$JOB_ROOT/control-config-check.json"

            python tooling/feynman_real_run_preflight.py \
              --plan "$ROOT/smoke-plan.json" \
              --ordinal "$ORDINAL" \
              --evaluator-case "$EVALUATOR/case.json" \
              --runner-job "$JOB_ROOT/runner-job.json" \
              --boundary-profile "$JOB_ROOT/boundary-profile.json" \
              --remote-environment "$JOB_ROOT/environments.toml" \
              --control-config "$JOB_ROOT/control-config.toml" \
              --output "$JOB_ROOT/readiness.json" \
              > "$JOB_ROOT/readiness.stdout.json"

            python - "$JOB_ROOT/readiness.json" "$CONDITION_ID" <<'PY'
          import json, sys
          result = json.load(open(sys.argv[1], encoding='utf-8'))
          condition = sys.argv[2]
          assert result['verdict'] == 'ready-for-control-plane-auth'
          assert result['job']['condition_id'] == condition
          assert result['authentication']['credential_value_read_by_preflight'] is False
          assert result['authentication']['candidate_auth_exposed'] is False
          assert result['required_external_input']['env_key_name'] == 'OPENAI_API_KEY'
          PY
          done

          python - "$ROOT" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          plan = json.loads((root / 'smoke-plan.json').read_text())
          readiness = []
          for ordinal in (1, 2):
              path = root / f'job-{ordinal}' / 'readiness.json'
              value = json.loads(path.read_text())
              readiness.append({
                  'ordinal': ordinal,
                  'case_id': value['job']['case_id'],
                  'condition_id': value['job']['condition_id'],
                  'readiness_sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
                  'verdict': value['verdict'],
              })
          summary = {
              'schema_version': 1,
              'verdict': 'integration-smoke-ready-for-external-auth',
              'analysis_use': plan['analysis_use'],
              'model_metadata_id': (root / 'selected-model.txt').read_text().strip(),
              'codex_version': (root / 'control-codex-version.txt').read_text().strip(),
              'smoke_plan_sha256': hashlib.sha256((root / 'smoke-plan.json').read_bytes()).hexdigest(),
              'jobs': readiness,
              'credential_value_used': False,
              'external_model_request_sent': False,
              'next_external_input': 'operator-controlled control-plane credential value',
          }
          (root / 'readiness-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload pre-auth readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feynman-real-run-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/feynman-real-run-readiness/codex-package-version.txt
            /tmp/feynman-real-run-readiness/control-codex-version.txt
            /tmp/feynman-real-run-readiness/tool-codex-version.txt
            /tmp/feynman-real-run-readiness/selected-model.txt
            /tmp/feynman-real-run-readiness/bundled-models.json
            /tmp/feynman-real-run-readiness/smoke-plan.json
            /tmp/feynman-real-run-readiness/readiness-summary.json
            /tmp/feynman-real-run-readiness/job-1/evaluator/case.json
            /tmp/feynman-real-run-readiness/job-1/candidate/task.txt
            /tmp/feynman-real-run-readiness/job-1/boundary-profile.json
            /tmp/feynman-real-run-readiness/job-1/runner-job.json
            /tmp/feynman-real-run-readiness/job-1/environments.toml
            /tmp/feynman-real-run-readiness/job-1/control-config.toml
            /tmp/feynman-real-run-readiness/job-1/readiness.json
            /tmp/feynman-real-run-readiness/job-2/evaluator/case.json
            /tmp/feynman-real-run-readiness/job-2/candidate/task.txt
            /tmp/feynman-real-run-readiness/job-2/boundary-profile.json
            /tmp/feynman-real-run-readiness/job-2/runner-job.json
            /tmp/feynman-real-run-readiness/job-2/environments.toml
            /tmp/feynman-real-run-readiness/job-2/control-config.toml
            /tmp/feynman-real-run-readiness/job-2/readiness.json
          if-no-files-found: error
          retention-days: 14
